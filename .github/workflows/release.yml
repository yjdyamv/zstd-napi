name: release
on:
  push:
    tags:
      - v*.*.*
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.0.14)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  determine-tag:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

  sanity-check:
    needs: [determine-tag]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.determine-tag.outputs.tag }}
      - name: Verify package.json has correct version for tag
        run: |
          pkg_json="$(jq -r .version package.json)"
          tag="${{ needs.determine-tag.outputs.tag }}"
          tag_ver="$(sed -E 's/^v([^-]+)(-.*)?$/\1/' <<< "$tag")"
          if [[ "$pkg_json" != "$tag_ver" ]]; then
            echo "::error::package.json has version ${pkg_json}, expected ${tag_ver}"
            exit 1
          fi

  create-draft-release:
    needs: [sanity-check, determine-tag]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.determine-tag.outputs.tag }}
      - run: |
          gh release delete '${{ needs.determine-tag.outputs.tag }}' --yes 2>/dev/null || true
          gh release create '${{ needs.determine-tag.outputs.tag }}' -t '${{ needs.determine-tag.outputs.tag }}' --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}

  prebuilds:
    needs: [create-draft-release, determine-tag]
    uses: ./.github/workflows/prebuilds.yml
    permissions:
      actions: read
      contents: write
      id-token: write
    with:
      provenance: true
      upload-assets: true
      release-ref: ${{ needs.determine-tag.outputs.tag }}
